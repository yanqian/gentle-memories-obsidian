name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag or release name to update.
        required: true
        default: "1.0.0"
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-assets:
    name: Build, upload, and attest release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build plugin
        run: ./init.sh

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" manifest.json main.js styles.css --clobber

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css
